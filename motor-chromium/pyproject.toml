[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astrobrowser"
version = "0.34.0"
description = "Playwright drop-in for the AstroBrowser anti-fingerprint Chromium build (Star Multlogin). launch() returns a standard Playwright Browser backed by the verified Star Multlogin Chromium binary."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-3-Clause" }
keywords = [
    "astrobrowser",
    "star-chromium",
    "playwright",
    "chromium",
    "anti-detect",
    "anti-fingerprint",
    "fingerprint",
    "farbling",
    "automation",
    "stealth",
    "ungoogled",
]
dependencies = [
    "playwright>=1.40",
    "maxminddb>=2.2",
]

[project.scripts]
astrobrowser = "astrobrowser._commands:_console_main"
star-chromium = "astrobrowser._commands:_console_main"
astrobrowser-agent = "astrobrowser.cli:main"
astrobrowser-serve = "astrobrowser._serve:_cli_main"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/sr-satoru/navegador"
Repository = "https://github.com/sr-satoru/navegador"
Issues = "https://github.com/sr-satoru/navegador/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["astrobrowser"]

[tool.hatch.build.targets.sdist]
include = ["astrobrowser", "README.md", "LICENSE"]
